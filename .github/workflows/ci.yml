name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when a newer commit lands, instead of leaving a
# queued job to be cancelled later -- a cancelled run shows red on the badge
# and is indistinguishable from a real failure at a glance.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Verify no private-tree imports
        shell: bash
        run: |
          python - <<'GUARD'
          import pathlib, re, sys
          FORBIDDEN = re.compile(r"import\s+genesis|from\s+genesis|provisionals")
          files = sorted(pathlib.Path("src").rglob("*.py"))
          if not files:
              sys.exit("::error::guard found no source files -- it would pass on anything")
          # Negative control: the guard must reject a planted needle, or a
          # clean result means nothing. `grep ... || true` would pass here.
          if not FORBIDDEN.search("from genesis.solver import x"):
              sys.exit("::error::guard no longer detects a known-bad import")
          bad = [f"{p}:{i}: {ln.strip()}"
                 for p in files
                 for i, ln in enumerate(p.read_text(encoding="utf-8").splitlines(), 1)
                 if FORBIDDEN.search(ln)]
          if bad:
              print("\n".join(bad))
              sys.exit("::error::package imports from a private source tree")
          print(f"checked {len(files)} file(s): no private-tree imports")
          GUARD

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff==0.14.9
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/ || echo "::warning::formatting drift (non-blocking)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata and that LICENCE ships
        run: |
          twine check dist/*
          python - <<'PY'
          import glob, zipfile
          for w in glob.glob('dist/*.whl'):
              names = zipfile.ZipFile(w).namelist()
              assert any('LICENSE' in n for n in names), f'{w}: LICENSE missing from wheel'
          print('licence files present in all wheels')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
