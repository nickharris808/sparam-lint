name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Verify no private-tree imports
        shell: bash
        run: |
          ! grep -rnE 'import genesis|from genesis|provisionals' --include='*.py' src/             || (echo "::error::package imports from a private source tree" && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/ || echo "::warning::formatting drift (non-blocking)"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install build twine
      - run: python -m build
      - name: Check metadata and that LICENCE ships
        run: |
          twine check dist/*
          python - <<'PY'
          import glob, zipfile
          for w in glob.glob('dist/*.whl'):
              names = zipfile.ZipFile(w).namelist()
              assert any('LICENSE' in n for n in names), f'{w}: LICENSE missing from wheel'
          print('licence files present in all wheels')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
